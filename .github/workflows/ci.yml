name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  swift-tests:
    name: Swift Host Tests (macOS 14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        run: swift --version

      - name: Checkout-Rooted Source Guards
        run: |
          ! git grep -n "CGRequestScreenCaptureAccess" -- 'apps/computer-use-host/Sources/'
          ! git grep -n "CGEvent" -- 'apps/computer-use-host/Sources/'
          ! git grep -n "Fake" -- 'apps/computer-use-host/Sources/'
          echo "Checkout-rooted source guards PASSED."

      - name: Build and Run Swift Host Unit & Integration Tests (Strict Concurrency & Warnings as Errors)
        run: |
          cd apps/computer-use-host
          swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors | tee swift_test.log
          grep -E "Test Suite.*passed|Executed [1-9]" swift_test.log

      - name: Build Release Executable & Guard Release Symbols
        run: |
          cd apps/computer-use-host
          swift build -c release -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          ! nm .build/release/ComputerUseHost | grep -i "Fake"
          echo "Release executable build and symbol guard PASSED."

  node-tests:
    name: TypeScript MCP Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: "pnpm"
          cache-dependency-path: mcp/computer-use-mcp/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd mcp/computer-use-mcp
          pnpm install --frozen-lockfile

      - name: TypeScript Check
        run: |
          cd mcp/computer-use-mcp
          pnpm check

      - name: Run MCP Server Unit & Integration Tests
        run: |
          cd mcp/computer-use-mcp
          pnpm test
